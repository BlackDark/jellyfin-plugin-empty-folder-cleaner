name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  call:
    permissions:
      issues: write
      pull-requests: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@2d1d8651c878e11ce83de5ecdbedb31e70ebc6f0 # master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
