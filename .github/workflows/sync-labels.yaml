name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  call:
    permissions:
      issues: write
      pull-requests: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@052bc316730c81b2ff27f971c0f8455d4cf05031 # master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
