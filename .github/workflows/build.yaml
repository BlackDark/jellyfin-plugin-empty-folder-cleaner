name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@052bc316730c81b2ff27f971c0f8455d4cf05031 # master
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
