name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@2d1d8651c878e11ce83de5ecdbedb31e70ebc6f0 # master
    with:
      repository-name: jellyfin/jellyfin-plugin-template
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
